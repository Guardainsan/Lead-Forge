services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Australia/Sydney
    volumes:
      # Bind-mount the repo's ./.n8n so the local Node run and the container
      # share one data dir. Primary dev path is `npx n8n`; this is the alternate.
      - ./.n8n:/home/node/.n8n